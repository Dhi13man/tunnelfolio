name: Release

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  authorize:
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.authorize.outputs.commit }}
      tag_object: ${{ steps.authorize.outputs.tag_object }}
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve remote release authorities
        id: refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          main_commit=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          tag_object=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" --jq .object.sha)
          [[ "$main_commit" =~ ^[0-9a-f]{40}$ ]]
          [[ "$tag_object" =~ ^[0-9a-f]{40}$ ]]
          printf 'main_commit=%s\n' "$main_commit" >> "$GITHUB_OUTPUT"
          printf 'tag_object=%s\n' "$tag_object" >> "$GITHUB_OUTPUT"
      - name: Authorize release tag and commit
        id: authorize
        env:
          EVENT_TAG_OBJECT: ${{ github.event.after }}
          MAIN_COMMIT: ${{ steps.refs.outputs.main_commit }}
          REMOTE_TAG_OBJECT: ${{ steps.refs.outputs.tag_object }}
        run: |
          set -euo pipefail
          ./scripts/verify-release-tag.sh \
            "$GITHUB_REPOSITORY" \
            "$GITHUB_REF_NAME" \
            "$EVENT_TAG_OBJECT" \
            "$GITHUB_SHA" \
            "$MAIN_COMMIT" \
            "$REMOTE_TAG_OBJECT" \
            CHANGELOG.md > "$GITHUB_OUTPUT"
      - name: Require exact-main CI
        env:
          AUTHORIZED_COMMIT: ${{ steps.authorize.outputs.commit }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for workflow in ci.yml codeql.yml; do
            conclusion="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?head_sha=$AUTHORIZED_COMMIT&branch=main&status=completed&per_page=10" --jq '.workflow_runs | map(select(.event == "push")) | first | .conclusion')"
            test "$conclusion" = success
          done

  build:
    needs: authorize
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goarch: amd64
            label: amd64
          - goarch: arm64
            label: arm64
          - goarch: arm
            goarm: "7"
            label: armv7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.authorize.outputs.commit }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Build archive
        env:
          LABEL: ${{ matrix.label }}
          RELEASE_COMMIT: ${{ needs.authorize.outputs.commit }}
          TARGET_GOARCH: ${{ matrix.goarch }}
          TARGET_GOARM: ${{ matrix.goarm }}
        run: ./scripts/build-release-archive.sh "$GITHUB_REF_NAME" "$RELEASE_COMMIT" "$TARGET_GOARCH" "$LABEL" "$TARGET_GOARM"
      - name: Generate archive SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          file: dist/tunnelfolio_${{ github.ref_name }}_linux_${{ matrix.label }}.tar.gz
          format: spdx-json
          output-file: dist/tunnelfolio_${{ github.ref_name }}_linux_${{ matrix.label }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Bind SBOM to archive
        env:
          LABEL: ${{ matrix.label }}
        run: |
          archive="dist/tunnelfolio_${GITHUB_REF_NAME}_linux_${LABEL}.tar.gz"
          ./scripts/bind-release-sbom.sh "$archive" "${archive%.tar.gz}.spdx.json" "$LABEL"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tunnelfolio-${{ matrix.label }}
          path: |
            dist/*.tar.gz
            dist/*.spdx.json
          if-no-files-found: error

  verify:
    needs: [authorize, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.authorize.outputs.commit }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: tunnelfolio-*
          merge-multiple: true
      - name: Create checksums
        run: cd dist && sha256sum -- *.spdx.json *.tar.gz | LC_ALL=C sort -k2 > SHA256SUMS
      - name: Verify release archives
        env:
          RELEASE_COMMIT: ${{ needs.authorize.outputs.commit }}
        run: ./scripts/verify-release-bundle.sh "$GITHUB_REF_NAME" "$RELEASE_COMMIT" dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tunnelfolio-release-${{ needs.authorize.outputs.tag_object }}
          path: dist/*
          if-no-files-found: error

  execute:
    needs: [authorize, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.authorize.outputs.commit }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tunnelfolio-release-${{ needs.authorize.outputs.tag_object }}
          path: dist
      - name: Install cross-architecture runners
        run: sudo apt-get update && sudo apt-get install --yes qemu-user-static
      - name: Execute all release binaries
        env:
          RELEASE_COMMIT: ${{ needs.authorize.outputs.commit }}
        run: ./scripts/execute-release-binaries.sh "$GITHUB_REF_NAME" "$RELEASE_COMMIT" dist

  publish:
    needs: [authorize, execute, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.authorize.outputs.commit }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tunnelfolio-release-${{ needs.authorize.outputs.tag_object }}
          path: dist
      - name: Attest archives
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz
      - name: Attest amd64 SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: dist/tunnelfolio_${{ github.ref_name }}_linux_amd64.tar.gz
          sbom-path: dist/tunnelfolio_${{ github.ref_name }}_linux_amd64.spdx.json
      - name: Attest arm64 SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: dist/tunnelfolio_${{ github.ref_name }}_linux_arm64.tar.gz
          sbom-path: dist/tunnelfolio_${{ github.ref_name }}_linux_arm64.spdx.json
      - name: Attest armv7 SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: dist/tunnelfolio_${{ github.ref_name }}_linux_armv7.tar.gz
          sbom-path: dist/tunnelfolio_${{ github.ref_name }}_linux_armv7.spdx.json
      - name: Publish GitHub release
        env:
          AUTHORIZED_COMMIT: ${{ needs.authorize.outputs.commit }}
          AUTHORIZED_TAG_OBJECT: ${{ needs.authorize.outputs.tag_object }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$AUTHORIZED_COMMIT"
          test "$(git rev-parse "refs/tags/$GITHUB_REF_NAME")" = "$AUTHORIZED_TAG_OBJECT"
          test "$(git rev-parse "$AUTHORIZED_TAG_OBJECT^{}")" = "$AUTHORIZED_COMMIT"
          version="${GITHUB_REF_NAME#v}"
          awk -v version="$version" '
            index($0, "## [" version "] - ") == 1 && $0 ~ / - [0-9]{4}-[0-9]{2}-[0-9]{2}$/ { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > /tmp/release-notes.md
          test -s /tmp/release-notes.md
          assets=(
            SHA256SUMS
            "tunnelfolio_${GITHUB_REF_NAME}_linux_amd64.spdx.json"
            "tunnelfolio_${GITHUB_REF_NAME}_linux_amd64.tar.gz"
            "tunnelfolio_${GITHUB_REF_NAME}_linux_arm64.spdx.json"
            "tunnelfolio_${GITHUB_REF_NAME}_linux_arm64.tar.gz"
            "tunnelfolio_${GITHUB_REF_NAME}_linux_armv7.spdx.json"
            "tunnelfolio_${GITHUB_REF_NAME}_linux_armv7.tar.gz"
          )
          mapfile -t actual < <(find dist -mindepth 1 -maxdepth 1 -printf '%f|%y\n' | LC_ALL=C sort)
          expected=()
          asset_paths=()
          for asset in "${assets[@]}"; do
            expected+=("$asset|f")
            asset_paths+=("dist/$asset")
          done
          test "${actual[*]}" = "${expected[*]}"
          gh release create "$GITHUB_REF_NAME" "${asset_paths[@]}" \
            --verify-tag \
            --notes-file /tmp/release-notes.md \
            --title "$GITHUB_REF_NAME"
